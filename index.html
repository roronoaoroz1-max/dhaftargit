<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhaftar 2026</title>

<link rel="icon" type="image/png" href="assets/app-icon.png">

<link rel="apple-touch-icon" href="assets/app-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/app-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dhaftar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eff6ff">
  
<style>
body {
  font-family: system-ui, sans-serif;
  background: #eff6ff;
  margin: 0;
  padding: 20px;
  color: #1e293b;
}

#splash {
  position: fixed;
  inset: 0;
  background: #eff6ff;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

#splash img {
  width: 170px;
  max-width: 65%;
}

.container {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 24px;
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.logo {
  display: block;
  width: 160px;
  max-width: 70%;
  margin: 0 auto 24px;
}

label {
  font-weight: 600;
  display: block;
  margin: 14px 0 6px;
}

select,
button {
  width: 100%;
  padding: 15px;
  font-size: 1rem;
  border-radius: 12px;
  border: 1px solid #cbd5e1;
  box-sizing: border-box;
}

button {
  margin-top: 18px;
  background: #2563eb;
  color: white;
  border: none;
  font-weight: 700;
  cursor: pointer;
}

.admin-btn {
  background: #111827;
  margin-bottom: 22px;
}

.dad-box {
  background: #fef3c7;
  border: 1px solid #f59e0b;
  color: #92400e;
  padding: 16px;
  border-radius: 14px;
  font-weight: 800;
  text-align: center;
  margin: 0 0 24px 0;
}

.result-section {
  margin-top: 28px;
  padding: 18px;
  background: #f8fafc;
  border-radius: 14px;
  border: 1px solid #e2e8f0;
  display: none;
}

.result-row {
  display: flex;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid #e2e8f0;
}

.result-row:last-child {
  border-bottom: none;
}

.amount {
  font-weight: 800;
  color: #1d4ed8;
}

.negative {
  color: #dc2626;
}

.bill-item {
  display: flex;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px dashed #e2e8f0;
}

#error {
  margin-top: 20px;
  text-align: center;
  font-weight: 700;
  color: #dc2626;
}

#loading {
  display: none;
  margin-top: 20px;
  text-align: center;
  font-weight: 700;
}
</style>
</head>

<body>

<div id="splash">
  <img src="assets/logo.png" alt="Dhaftar Logo">
</div>

<div class="container">
  <img src="assets/logo.png" class="logo" alt="Dhaftar Logo">

  <button class="admin-btn" onclick="window.location.href='admin.html'">
    Admin Access
  </button>

  <div class="dad-box">
    Dad Borrowing: <span id="dadBorrowingTop">Loading...</span>
  </div>

  <label>Select Month</label>
  <select id="monthSelector">
    <option value="" selected disabled>Select a month</option>
    <option>January</option>
    <option>February</option>
    <option>March</option>
    <option>April</option>
    <option>May</option>
    <option>June</option>
    <option>July</option>
    <option>August</option>
    <option>September</option>
    <option>October</option>
    <option>November</option>
    <option>December</option>
  </select>

  <button onclick="getBalance()">Calculate Balance</button>

  <div id="loading">Calculating...</div>
  <div id="error"></div>

  <div id="result" class="result-section">
    <div class="result-row">
      <strong>Total Amount Due</strong>
      <span class="amount" id="totalDue">MVR 0</span>
    </div>

    <div class="result-row">
      <strong>Amount Paid</strong>
      <span class="amount" id="totalPaid">MVR 0</span>
    </div>

    <div class="result-row">
      <strong>Remaining Amount</strong>
      <span class="amount" id="remaining">MVR 0</span>
    </div>
  </div>

  <div id="bills" class="result-section">
    <h3>Bills Summary — <span id="selectedMonth"></span></h3>
    <div id="billsList"></div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxPrt1iDtxFtobHuJy_0k0QDMB-CSMCN5simJ3VDQpBd-4_4FlgJBCd-0NFzkBDEqpCcA/exec";

async function api(action, data = {}) {
  const response = await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ action, data })
  });

  return await response.json();
}

function formatMVR(num) {
  const value = Number(num);

  if (!Number.isFinite(value)) return "MVR —";

  return "MVR " + value.toLocaleString("en-IN", {
    minimumFractionDigits: 0,
    maximumFractionDigits: 0
  });
}

async function loadDadBorrowingTop() {
  try {
    const data = await api("summary", { month: "January" });

    if (data.success !== false) {
      document.getElementById("dadBorrowingTop").textContent = formatMVR(data.dadsBorrowing);
    } else {
      document.getElementById("dadBorrowingTop").textContent = "MVR —";
    }
  } catch (err) {
    document.getElementById("dadBorrowingTop").textContent = "MVR —";
  }
}

async function getBalance() {
  const month = document.getElementById("monthSelector").value;

  if (!month) {
    showError("Please select a month first.");
    return;
  }

  document.getElementById("loading").style.display = "block";
  document.getElementById("error").textContent = "";
  document.getElementById("result").style.display = "none";
  document.getElementById("bills").style.display = "none";

  try {
    const data = await api("summary", { month });

    if (data.success === false) {
      showError(data.message);
      return;
    }

    displayResult(data);
  } catch (err) {
    showError(err.message);
  } finally {
    document.getElementById("loading").style.display = "none";
  }
}

function displayResult(data) {
  document.getElementById("dadBorrowingTop").textContent = formatMVR(data.dadsBorrowing);

  document.getElementById("totalDue").textContent = formatMVR(data.totalAmountDue);
  document.getElementById("totalPaid").textContent = formatMVR(data.totalPaid);
  document.getElementById("remaining").textContent = formatMVR(data.remainingBalance);

  if (Number(data.remainingBalance) > 0) {
    document.getElementById("remaining").classList.add("negative");
  } else {
    document.getElementById("remaining").classList.remove("negative");
  }

  document.getElementById("result").style.display = "block";

  const list = document.getElementById("billsList");
  list.innerHTML = "";

  if (Array.isArray(data.billBreakdown)) {
    data.billBreakdown.forEach(bill => {
      const item = document.createElement("div");
      item.className = "bill-item";

      item.innerHTML = `
        <span>${bill.type}</span>
        <strong>${formatMVR(bill.amount)}</strong>
      `;

      list.appendChild(item);
    });

    document.getElementById("selectedMonth").textContent = data.month;
    document.getElementById("bills").style.display = "block";
  }
}

function showError(message) {
  document.getElementById("error").textContent = message || "Something went wrong.";
}

window.addEventListener("load", () => {
  loadDadBorrowingTop();

  setTimeout(() => {
    document.getElementById("splash").style.display = "none";
  }, 1000);
});
</script>

</body>
</html>
