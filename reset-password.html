<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Reset Password · Dhaftar</title>

  <meta
    name="description"
    content="Create a new password for Dhaftar."
  >

  <meta name="theme-color" content="#0f766e">

  <link
    rel="icon"
    type="image/png"
    href="assets/app-icon.png"
  >

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="assets/app-icon.png"
  >

  <script>
    (() => {
      try {
        const savedTheme =
          localStorage.getItem("dhaftar-theme");

        const prefersDark =
          window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;

        document.documentElement.dataset.theme =
          savedTheme ||
          (prefersDark ? "dark" : "light");

      } catch (_) {
        document.documentElement.dataset.theme =
          "light";
      }
    })();
  </script>

  <style>
    :root {
      color-scheme: light;

      --ink: #16302d;
      --muted: #647773;

      --brand: #0f766e;
      --brand-dark: #0b5d57;
      --brand-soft: #e7f7f3;

      --surface: #ffffff;
      --surface-soft: #f8fbfa;
      --canvas: #f3f7f5;

      --line: #dfe9e5;

      --danger: #b42318;
      --danger-soft: #fff1f0;

      --success: #16794d;
      --success-soft: #eaf8f0;

      --shadow:
        0 20px 50px rgba(17, 66, 59, 0.10);

      --radius: 24px;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;

      --ink: #e8f3ef;
      --muted: #9eb5ae;

      --brand: #4dd4c4;
      --brand-dark: #35b9aa;
      --brand-soft: #133d38;

      --surface: #142320;
      --surface-soft: #172824;
      --canvas: #0b1513;

      --line: #29413c;

      --danger: #ff8f87;
      --danger-soft: #3f211f;

      --success: #75d8a6;
      --success-soft: #17392a;

      --shadow:
        0 20px 50px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--ink);

      background:
        radial-gradient(
          circle at 10% 0%,
          rgba(15, 118, 110, 0.12),
          transparent 34rem
        ),
        var(--canvas);
    }

    button,
    input {
      font: inherit;
    }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline:
        3px solid rgba(15, 118, 110, 0.28);

      outline-offset: 3px;
    }

    [hidden] {
      display: none !important;
    }

    .app-shell {
      width: min(100% - 28px, 500px);
      margin: 0 auto;
      padding: 28px 0 60px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;

      margin-bottom: 38px;
    }

    .logo {
      display: block;

      width: 142px;
      max-height: 58px;

      object-fit: contain;
      object-position: left center;
    }

    .theme-toggle {
      display: inline-grid;
      place-items: center;

      width: 44px;
      height: 44px;
      padding: 0;

      border: 1px solid var(--line);
      border-radius: 50%;

      color: var(--ink);
      background: var(--surface);

      cursor: pointer;
      font-size: 1.05rem;
    }

    .card {
      padding:
        clamp(24px, 6vw, 42px);

      border: 1px solid var(--line);
      border-radius: var(--radius);

      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .reset-mark {
      display: grid;
      place-items: center;

      width: 50px;
      height: 50px;

      margin-bottom: 22px;

      border-radius: 16px;

      color: var(--brand);
      background: var(--brand-soft);

      font-size: 1.3rem;
      font-weight: 850;
    }

    .eyebrow {
      margin: 0 0 7px;

      color: var(--brand);

      font-size: 0.76rem;
      font-weight: 850;

      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      font-size:
        clamp(1.9rem, 7vw, 2.65rem);

      line-height: 1.07;
      letter-spacing: -0.04em;
    }

    .intro {
      margin: 12px 0 28px;

      color: var(--muted);

      line-height: 1.55;
    }

    .field + .field {
      margin-top: 17px;
    }

    label {
      display: block;
      margin-bottom: 8px;

      font-size: 0.88rem;
      font-weight: 750;
    }

    .password-wrap {
      position: relative;
    }

    input {
      width: 100%;
      min-height: 52px;

      padding: 0 68px 0 15px;

      border: 1px solid var(--line);
      border-radius: 13px;

      color: var(--ink);
      background: var(--surface-soft);
    }

    input:focus {
      border-color: var(--brand);

      box-shadow:
        0 0 0 4px rgba(15, 118, 110, 0.12);

      background: var(--surface);
      outline: none;
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 8px;

      transform: translateY(-50%);

      min-height: 36px;
      padding: 0 9px;

      border: 0;
      border-radius: 8px;

      color: var(--brand);
      background: transparent;

      font-size: 0.78rem;
      font-weight: 800;

      cursor: pointer;
    }

    .password-help {
      margin: 8px 0 0;

      color: var(--muted);

      font-size: 0.76rem;
      line-height: 1.45;
    }

    .primary-button,
    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      width: 100%;
      min-height: 52px;

      border-radius: 13px;

      font-weight: 800;
    }

    .primary-button {
      margin-top: 21px;

      border: 0;

      color: #ffffff;
      background: #0f766e;

      cursor: pointer;

      box-shadow:
        0 8px 18px rgba(15, 118, 110, 0.22);
    }

    .primary-button:hover:not(:disabled) {
      background: #0b5d57;
      transform: translateY(-1px);
    }

    .primary-button:disabled {
      opacity: 0.62;
      cursor: wait;
    }

    .back-link {
      margin-top: 13px;

      border: 1px solid var(--line);

      color: var(--brand);
      background: var(--brand-soft);

      text-decoration: none;
    }

    .spinner {
      display: none;

      width: 15px;
      height: 15px;

      border:
        2px solid rgba(255, 255, 255, 0.38);

      border-top-color: #ffffff;
      border-radius: 50%;

      animation: spin 0.7s linear infinite;
    }

    button.is-loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .message {
      display: none;

      margin-top: 17px;
      padding: 12px 14px;

      border: 1px solid;
      border-radius: 12px;

      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.45;
    }

    .message.is-visible {
      display: block;
    }

    .message.success {
      color: var(--success);
      background: var(--success-soft);
      border-color: var(--success);
    }

    .message.error {
      color: var(--danger);
      background: var(--danger-soft);
      border-color: var(--danger);
    }

    .checking {
      padding: 22px 0;

      color: var(--muted);

      text-align: center;
      line-height: 1.55;
    }

    .checking-spinner {
      display: block;

      width: 28px;
      height: 28px;

      margin: 0 auto 13px;

      border:
        3px solid rgba(15, 118, 110, 0.18);

      border-top-color: var(--brand);
      border-radius: 50%;

      animation: spin 0.7s linear infinite;
    }

    @media (max-width: 520px) {
      .app-shell {
        padding-top: 18px;
      }

      .topbar {
        margin-bottom: 30px;
      }

      .logo {
        width: 120px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="app-shell">

    <header class="topbar">

      <img
        src="assets/logo.png"
        class="logo"
        alt="Dhaftar"
      >

      <button
        class="theme-toggle"
        id="themeToggle"
        type="button"
        aria-label="Switch theme"
        title="Switch theme"
      >
        <span
          id="themeIcon"
          aria-hidden="true"
        >
          ☾
        </span>
      </button>

    </header>

    <section
      class="card"
      aria-labelledby="pageTitle"
    >

      <div
        class="reset-mark"
        aria-hidden="true"
      >
        🔑
      </div>

      <p class="eyebrow">
        Secure recovery
      </p>

      <h1 id="pageTitle">
        Reset your password
      </h1>

      <p class="intro">
        Enter a new password for your Dhaftar administrator
        account.
      </p>

      <div
        class="checking"
        id="checkingBox"
      >
        <span
          class="checking-spinner"
          aria-hidden="true"
        ></span>

        Checking your recovery link…
      </div>

      <form
        id="resetForm"
        hidden
      >

        <div class="field">

          <label for="newPassword">
            New password
          </label>

          <div class="password-wrap">

            <input
              type="password"
              id="newPassword"
              autocomplete="new-password"
              minlength="8"
              required
            >

            <button
              type="button"
              class="password-toggle"
              data-target="newPassword"
            >
              Show
            </button>

          </div>

          <p class="password-help">
            Use at least 8 characters.
          </p>

        </div>

        <div class="field">

          <label for="confirmPassword">
            Confirm new password
          </label>

          <div class="password-wrap">

            <input
              type="password"
              id="confirmPassword"
              autocomplete="new-password"
              minlength="8"
              required
            >

            <button
              type="button"
              class="password-toggle"
              data-target="confirmPassword"
            >
              Show
            </button>

          </div>

        </div>

        <button
          class="primary-button"
          id="resetButton"
          type="submit"
        >
          <span
            class="spinner"
            aria-hidden="true"
          ></span>

          <span class="button-label">
            Save new password
          </span>
        </button>

      </form>

      <div
        id="message"
        class="message"
        role="alert"
        aria-live="polite"
      ></div>

      <a
        href="admin.html"
        class="back-link"
        id="backToLogin"
        hidden
      >
        Return to admin login
      </a>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>

  <script>
    const checkingBox =
      document.getElementById(
        "checkingBox"
      );

    const resetForm =
      document.getElementById(
        "resetForm"
      );

    const message =
      document.getElementById(
        "message"
      );

    const backToLogin =
      document.getElementById(
        "backToLogin"
      );

    let recoverySessionReady = false;


    function setTheme(
      theme,
      remember = true
    ) {
      document.documentElement.dataset.theme =
        theme;

      const isDark =
        theme === "dark";

      document.getElementById(
        "themeIcon"
      ).textContent =
        isDark ? "☀" : "☾";

      document.querySelector(
        'meta[name="theme-color"]'
      ).content =
        isDark
          ? "#0b1513"
          : "#0f766e";

      if (remember) {
        try {
          localStorage.setItem(
            "dhaftar-theme",
            theme
          );
        } catch (_) {}
      }
    }


    function showMessage(
      text,
      isError = false
    ) {
      message.textContent =
        text || "";

      message.className =
        "message";

      if (text) {
        message.classList.add(
          "is-visible",
          isError
            ? "error"
            : "success"
        );
      }
    }


    function setButtonLoading(
      loading
    ) {
      const button =
        document.getElementById(
          "resetButton"
        );

      const label =
        button.querySelector(
          ".button-label"
        );

      button.disabled =
        loading;

      button.classList.toggle(
        "is-loading",
        loading
      );

      label.textContent =
        loading
          ? "Saving…"
          : "Save new password";
    }


    function readRecoveryError() {
      const hashParams =
        new URLSearchParams(
          window.location.hash
            .replace(/^#/, "")
        );

      const queryParams =
        new URLSearchParams(
          window.location.search
        );

      const errorCode =
        hashParams.get("error_code") ||
        queryParams.get("error_code");

      const errorDescription =
        hashParams.get(
          "error_description"
        ) ||
        queryParams.get(
          "error_description"
        );

      if (
        errorCode ||
        errorDescription
      ) {
        return (
          errorDescription ||
          "The recovery link is invalid or has expired."
        ).replace(/\+/g, " ");
      }

      return "";
    }


    function showRecoveryForm() {
      if (recoverySessionReady) {
        return;
      }

      recoverySessionReady = true;

      checkingBox.hidden = true;
      resetForm.hidden = false;

      showMessage("");
    }


    function showInvalidLink(
      errorText
    ) {
      checkingBox.hidden = true;
      resetForm.hidden = true;
      backToLogin.hidden = false;

      showMessage(
        errorText ||
        "This password recovery link is invalid or has expired. Request a new link from the admin login page.",
        true
      );
    }


    async function checkRecoverySession() {
      const linkError =
        readRecoveryError();

      if (linkError) {
        showInvalidLink(linkError);
        return;
      }

      try {
        const {
          data,
          error
        } =
          await supabaseClient.auth
            .getSession();

        if (error) {
          throw error;
        }

        if (data.session) {
          showRecoveryForm();
          return;
        }

        setTimeout(
          async () => {
            if (recoverySessionReady) {
              return;
            }

            const {
              data: retryData
            } =
              await supabaseClient.auth
                .getSession();

            if (retryData.session) {
              showRecoveryForm();
            } else {
              showInvalidLink(
                "This recovery link is invalid or has expired. Request a new password reset email."
              );
            }
          },
          1500
        );

      } catch (error) {
        showInvalidLink(
          error.message ||
          "Unable to verify the recovery link."
        );
      }
    }


    async function updatePassword() {
      const newPassword =
        document.getElementById(
          "newPassword"
        ).value;

      const confirmPassword =
        document.getElementById(
          "confirmPassword"
        ).value;

      if (newPassword.length < 8) {
        showMessage(
          "Your password must contain at least 8 characters.",
          true
        );

        document.getElementById(
          "newPassword"
        ).focus();

        return;
      }

      if (
        newPassword !==
        confirmPassword
      ) {
        showMessage(
          "The two passwords do not match.",
          true
        );

        document.getElementById(
          "confirmPassword"
        ).focus();

        return;
      }

      setButtonLoading(true);
      showMessage("");

      try {
        const {
          error
        } =
          await supabaseClient.auth
            .updateUser({
              password:
                newPassword
            });

        if (error) {
          throw error;
        }

        resetForm.reset();
        resetForm.hidden = true;
        backToLogin.hidden = false;

        showMessage(
          "Password updated successfully. You can now return to the admin login page."
        );

        await supabaseClient.auth
          .signOut();

      } catch (error) {
        showMessage(
          error.message ||
          "Unable to update your password.",
          true
        );

      } finally {
        setButtonLoading(false);
      }
    }


    supabaseClient.auth
      .onAuthStateChange(
        (event, session) => {
          if (
            event ===
              "PASSWORD_RECOVERY" ||
            session
          ) {
            showRecoveryForm();
          }
        }
      );


    document
      .getElementById(
        "themeToggle"
      )
      .addEventListener(
        "click",
        () => {
          setTheme(
            document.documentElement
              .dataset.theme ===
              "dark"
              ? "light"
              : "dark"
          );
        }
      );


    document
      .querySelectorAll(
        ".password-toggle"
      )
      .forEach((button) => {
        button.addEventListener(
          "click",
          () => {
            const input =
              document.getElementById(
                button.dataset.target
              );

            const visible =
              input.type === "text";

            input.type =
              visible
                ? "password"
                : "text";

            button.textContent =
              visible
                ? "Show"
                : "Hide";
          }
        );
      });


    document
      .getElementById(
        "resetForm"
      )
      .addEventListener(
        "submit",
        (event) => {
          event.preventDefault();
          updatePassword();
        }
      );


    window.addEventListener(
      "load",
      () => {
        setTheme(
          document.documentElement
            .dataset.theme ||
          "light",
          false
        );

        checkRecoverySession();
      }
    );
  </script>
</body>
</html>
